name: Sort .resw files

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    sort:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Sort .resw files
              run: python .github/scripts/sort-resw.py

            - name: Check for changes and commit
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "[action] Automatically sort .resw localisation keys"
