name: Accessibility report ♿
description: Create a accessibility report to help us fix an accessibility issue in WinClicker.
title: "♿ Accessibility: "
labels: ["🐛 bug", "♿ accessibility"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report an accessibility issue in WinClicker.
              An accessibility issue is a demonstrable problem that limits the ease of use of the app for users that need assistive technologies.
              Wrong category? Go back and choose a different template.

    - type: textarea
      id: description
      attributes:
          label: 📝 Describe the issue
          description: |
              Provide a clear and concise description of what the accessibility issue is.
          placeholder: |
              When focusing an icon‐only button, it doesn’t have an accessible label attached…
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: 🔢 Steps to reproduce
          description: |
              Provide step‐by‐step instructions so we can reliably reproduce the issue.
          placeholder: |
              1. Start the NVDA screen reader.
              2. Open the WinClicker program.
              3. Click the **Click coordinates** expander button.
              4. Focus the **Pick coordinates** icon button inside the expander with the keyboard.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: ✅ Expected result
          description: |
              What did you expect to happen?
          placeholder: |
              The icon‐only button announces an accessible label.
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: ❌ Actual result
          description: |
              What actually happened instead?
          placeholder: |
              The accessibility label never got announced due to it being missing.
      validations:
          required: true

    - type: textarea
      id: screenshots
      attributes:
          label: 🖼️ Screenshots
          description: |
              If applicable, add screenshots to help explain the issue.
      validations:
          required: false

    - type: input
      id: winclicker-version
      attributes:
          label: 🔢 WinClicker version
          description: Issues will be disregarded on unsupported versions of WinClicker.
          placeholder: WinClicker v2.1.0
      validations:
          required: true

    - type: dropdown
      id: os
      attributes:
          label: 💻 Operating system
          options:
              - Windows 11
              - Windows 10
      validations:
          required: true

    - type: input
      id: os-version
      attributes:
          label: 💻🔢 Operating system version
          placeholder: Version 26H2 (Build 26300.9550)
      validations:
          required: true

    - type: textarea
      id: additional
      attributes:
          label: ℹ️ Additional information
          description: |
              Anything else that might help us debug the issue.
      validations:
          required: false

    - type: checkboxes
      id: confirmations
      attributes:
          label: ✅ Confirmations
          options:
              - label: I have searched for existing issues that describe this problem.
                required: true
              - label: I can reliably reproduce this issue.
                required: true
              - label: I am willing to submit a pull request for this.
                required: false
